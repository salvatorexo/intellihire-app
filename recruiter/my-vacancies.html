<!-- EDIT MODAL -->
<div class="modal-overlay" id="editModal">
    <div class="modal">
        <button class="modal-close" id="editClose">×</button>
        <div class="modal-body">
            <h2>Edit Vacancy</h2>
            <form id="editForm" style="margin-top:18px;">
                <input type="hidden" id="edit_id" />
                <div class="form-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
                    <div class="form-group full" style="grid-column:1/-1;">
                        <label>Job Title</label>
                        <input type="text" id="edit_title" required />
                    </div>
                    <div class="form-group full" style="grid-column:1/-1;">
                        <label>Description</label>
                        <textarea id="edit_description" rows="4"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" id="edit_location" />
                    </div>
                    <div class="form-group">
                        <label>Employment Type</label>
                        <select id="edit_job_type">
                            <option>Full-time</option>
                            <option>Part-time</option>
                            <option>Contract</option>
                            <option>Internship</option>
                            <option>Remote</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Salary Range</label>
                        <input type="text" id="edit_salary_range" />
                    </div>
                    <div class="form-group">
                        <label>Deadline</label>
                        <input type="date" id="edit_deadline" />
                    </div>
                    <div class="form-group full" style="grid-column:1/-1;">
                        <label>Education</label>
                        <input type="text" id="edit_education_requirements" />
                    </div>
                    <div class="form-group full" style="grid-column:1/-1;">
                        <label>Requirements</label>
                        <textarea id="edit_requirements" rows="3"></textarea>
                    </div>
                    <div class="form-group full" style="grid-column:1/-1;">
                        <label>Skills</label>
                        <input type="text" id="edit_skills" />
                    </div>
                    <div class="form-group full" style="grid-column:1/-1;">
                        <label>Preferred Skills</label>
                        <input type="text" id="edit_preferred_skills" />
                    </div>
                </div>
                <div style="margin-top:20px;display:flex;gap:12px;">
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save Changes</button>
                    <button type="button" class="btn btn-outline" id="cancelEdit">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="../js/csrf.js"></script>
<script src="../js/my-vacancies.js"></script>
</body>
</html>
