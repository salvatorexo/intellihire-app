<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My CV | IntelliHire</title>
    <link rel="stylesheet" href="../css/dashboard.css" />
    <style>
        .cv-panel {
            max-width: 640px;
            background: var(--white);
            padding: 30px;
            border-radius: 14px;
            border: 1px solid var(--border);
        }
        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #f8fafc;
        }
        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: var(--primary);
            background: #eff6ff;
        }
        .drop-zone .icon { font-size: 2.6rem; margin-bottom: 8px; }
        .drop-zone p { color: var(--gray); font-size: 0.9rem; }
        .drop-zone .hint { font-size: 0.78rem; margin-top: 6px; }
        .file-info {
            margin-top: 16px;
            padding: 14px;
            background: #eff6ff;
            border-radius: 10px;
            display: none;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }
        .file-info.visible { display: flex; }
        .progress-bar {
            height: 8px;
            background: var(--light);
            border-radius: 50px;
            margin-top: 12px;
            overflow: hidden;
            display: none;
        }
        .progress-bar.visible { display: block; }
        .progress-fill {
            height: 100%;
            width: 0;
            background: var(--primary);
            transition: width 0.3s;
        }
        .current-cv {
            background: #f8fafc;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 22px;
            border: 1px solid var(--border);
        }
        .current-cv h4 { font-size: 0.95rem; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <span class="logo-mark">IHR</span>
                <span class="logo-text">IntelliHire</span>
            </div>
            <nav class="sidebar-nav">
                <a href="applicantdash.html" class="nav-item"><span class="nav-icon">🏠</span> Dashboard</a>
                <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span> My Profile</a>
                <a href="cv.html" class="nav-item active"><span class="nav-icon">📄</span> My CV</a>
                <a href="find-jobs.html" class="nav-item"><span class="nav-icon">🔍</span> Find Jobs</a>
                <a href="applications.html" class="nav-item"><span class="nav-icon">📋</span> My Applications</a>
                <a href="notifications.html" class="nav-item"><span class="nav-icon">🔔</span> Notifications</a>
                <a href="../php/logout.php" class="nav-item logout"><span class="nav-icon">🚪</span> Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <button class="menu-toggle" id="menuToggle">☰</button>
                <h2>My CV</h2>
            </header>

            <div id="alertBox" class="alert" style="display:none; max-width:640px; margin-bottom:16px;"></div>

            <div class="cv-panel">
                <!-- Current CV -->
                <div class="current-cv" id="currentCV" style="display:none;">
                    <h4>Current CV</h4>
                    <p id="currentCVInfo"></p>
                </div>

                <h3 style="margin-bottom:12px;">Upload / Replace CV</h3>

                <form id="cvForm">
                    <div class="drop-zone" id="dropZone">
                        <div class="icon">📄</div>
                        <p><strong>Click to browse</strong> or drag & drop your CV here</p>
                        <p class="hint">Accepted: PDF, DOCX · Max size: 5 MB</p>
                        <input type="file" id="cvInput" name="cv" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden />
                    </div>

                    <div class="file-info" id="fileInfo">
                        <span id="fileName">file.pdf</span>
                        <span id="fileSize">0 KB</span>
                    </div>

                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" id="uploadBtn" style="margin-top:20px;" disabled>
                        Upload CV
                    </button>
                </form>
            </div>
        </main>
    </div>
    <script src="../js/csrf.js"></script>
    <script src="../js/cv.js"></script>
</body>
</html>
