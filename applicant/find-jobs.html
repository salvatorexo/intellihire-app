<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find Jobs | IntelliHire</title>
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/vacancies.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

<div class="app-layout">

    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <span class="logo-mark">IHR</span>
            <span class="logo-text">IntelliHire</span>
        </div>
        <nav class="sidebar-nav">
            <a href="applicantdash.html" class="nav-item"><span class="nav-icon">🏠</span> Dashboard</a>
            <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span> My Profile</a>
            <a href="cv.html" class="nav-item"><span class="nav-icon">📄</span> My CV</a>
            <a href="vacancies.html" class="nav-item active"><span class="nav-icon">🔍</span> Find Jobs</a>
            <a href="applications.html" class="nav-item"><span class="nav-icon">📋</span> My Applications</a>
            <a href="notifications.html" class="nav-item"><span class="nav-icon">🔔</span> Notifications</a>
            <a href="../php/logout.php" class="nav-item logout"><span class="nav-icon">🚪</span> Logout</a>
        </nav>
    </aside>

    <!-- ================= MAIN ================= -->
    <main class="main-content">

        <header class="topbar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <h2>Find Jobs</h2>
        </header>

        <div id="alertBox" class="alert" style="display:none;"></div>

        <!-- ============ SEARCH & FILTERS ============ -->
        <section class="filters-panel">
            <div class="search-row">
                <input type="text" id="searchInput" placeholder="🔍 Search job title, company, skills..." />
                <button class="btn btn-primary" id="searchBtn">Search</button>
            </div>

            <div class="filter-row">
                <div class="filter-group">
                    <label>Category</label>
                    <select id="filterCategory">
                        <option value="">All Categories</option>
                        <option value="Technology">Technology / IT</option>
                        <option value="Finance">Finance / Banking</option>
                        <option value="Healthcare">Healthcare</option>
                        <option value="Education">Education</option>
                        <option value="Retail">Retail / E-commerce</option>
                        <option value="Manufacturing">Manufacturing</option>
                        <option value="Construction">Construction</option>
                        <option value="Agriculture">Agriculture</option>
                        <option value="Media">Media / Entertainment</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Location</label>
                    <input type="text" id="filterLocation" placeholder="e.g. Nairobi" />
                </div>

                <div class="filter-group">
                    <label>Job Type</label>
                    <select id="filterJobType">
                        <option value="">All Types</option>
                        <option value="Full-time">Full-time</option>
                        <option value="Part-time">Part-time</option>
                        <option value="Contract">Contract</option>
                        <option value="Internship">Internship</option>
                        <option value="Remote">Remote</option>
                    </select>
                </div>

                <button class="btn btn-outline" id="resetBtn">Reset</button>
            </div>
        </section>

        <!-- ============ RESULTS HEADER ============ -->
        <div class="results-header">
            <p><strong id="jobCount">0</strong> job(s) found</p>
            <select id="sortSelect">
                <option value="newest">Newest first</option>
                <option value="deadline">Deadline soonest</option>
                <option value="title">Title A–Z</option>
            </select>
        </div>

        <!-- ============ JOBS GRID ============ -->
        <div class="jobs-list" id="jobsList">
            <p class="empty">Loading jobs...</p>
        </div>

    </main>
</div>

<!-- ======================================================
     JOB DETAIL MODAL
     ====================================================== -->
<div class="modal-overlay" id="jobModal">
    <div class="modal">
        <button class="modal-close" id="modalClose">×</button>

        <div class="modal-body" id="modalBody">
            <!-- Filled dynamically -->
        </div>
    </div>
</div>
<script src="../js/csrf.js"></script>
<script src="../js/vacancies.js"></script>
</body>
</html>
