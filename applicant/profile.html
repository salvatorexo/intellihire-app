<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile | IntelliHire</title>
    <link rel="stylesheet" href="../css/dashboard.css" />
    <style>
        .profile-form {
            max-width: 780px;
            background: var(--white);
            padding: 30px;
            border-radius: 14px;
            border: 1px solid var(--border);
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label {
            font-size: 0.88rem;
            font-weight: 500;
            margin-bottom: 6px;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 11px 14px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.92rem;
            background: #f8fafc;
        }
        .form-group input:focus,
        .form-group textarea:focus { outline: none; border-color: var(--primary); background: var(--white); }
        .form-group textarea { resize: vertical; min-height: 90px; }

        @media (max-width: 700px) {
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <span class="logo-mark">IHR</span>
                <span class="logo-text">IntelliHire</span>
            </div>
            <nav class="sidebar-nav">
                <a href="applicantdash.html" class="nav-item"><span class="nav-icon">🏠</span> Dashboard</a>
                <a href="profile.html" class="nav-item active"><span class="nav-icon">👤</span> My Profile</a>
                <a href="cv.html" class="nav-item"><span class="nav-icon">📄</span> My CV</a>
                <a href="find-jobs.html" class="nav-item"><span class="nav-icon">🔍</span> Find Jobs</a>
                <a href="applications.html" class="nav-item"><span class="nav-icon">📋</span> My Applications</a>
                <a href="notifications.html" class="nav-item"><span class="nav-icon">🔔</span> Notifications</a>
                <a href="../php/logout.php" class="nav-item logout"><span class="nav-icon">🚪</span> Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <button class="menu-toggle" id="menuToggle">☰</button>
                <h2>My Profile</h2>
            </header>

            <div id="alertBox" class="alert" style="display:none; max-width:780px; margin-bottom:16px;"></div>

            <form id="profileForm" class="profile-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="full_name" name="full_name" required />
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="email" name="email" readonly style="background:#f1f5f9; cursor:not-allowed;" />
                    </div>
                    <div class="form-group">
                        <label>Phone *</label>
                        <input type="tel" id="phone" name="phone" required />
                    </div>
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" id="location" name="location" placeholder="e.g. Nairobi, Kenya" />
                    </div>
                    <div class="form-group">
                        <label>University / College</label>
                        <input type="text" id="university" name="university" />
                    </div>
                    <div class="form-group">
                        <label>Course / Field of Study</label>
                        <input type="text" id="course" name="course" />
                    </div>
                    <div class="form-group">
                        <label>Graduation Year</label>
                        <input type="number" id="graduation_year" name="graduation_year" min="1980" max="2100" />
                    </div>
                    <div class="form-group full">
                        <label>Skills (comma separated)</label>
                        <input type="text" id="skills" name="skills" placeholder="e.g. PHP, MySQL, JavaScript" />
                    </div>
                    <div class="form-group full">
                        <label>Certifications</label>
                        <textarea id="certifications" name="certifications" placeholder="e.g. AWS Certified, Google Analytics"></textarea>
                    </div>
                    <div class="form-group full">
                        <label>Work Experience</label>
                        <textarea id="work_experience" name="work_experience" placeholder="List your previous jobs..."></textarea>
                    </div>
                    <div class="form-group full">
                        <label>Education</label>
                        <textarea id="education" name="education" placeholder="Your education history..."></textarea>
                    </div>
                </div>

                <div style="margin-top:24px; display:flex; gap:12px;">
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save Changes</button>
                    <a href="applicantdash.html" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </main>
    </div>
    <script src="../js/csrf.js"></script>
    <script src="../js/profile.js"></script>
</body>
</html>
