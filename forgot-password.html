<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | IntelliHire</title>
    <link rel="stylesheet" href="css/login.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <span class="logo-mark">IHR</span>
                <span class="logo-text">IntelliHire</span>
            </a>
            <a href="login.html" class="btn btn-outline">Login</a>
        </div>
    </header>

    <main class="login-wrapper">
        <div class="login-card">
            <div class="login-head">
                <h1>Forgot Password?</h1>
                <p>Enter your email and we'll send you a reset link.</p>
            </div>

            <div id="alertBox" class="alert" style="display:none;"></div>

            <form id="forgotForm" novalidate>
                <div class="form-group">
                    <label for="email">Email Address <span class="req">*</span></label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required />
                    <small class="error" data-for="email"></small>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                    Send Reset Link
                </button>

                <p class="register-link">
                    Remembered it? <a href="login.html">Back to Login</a>
                </p>
            </form>
        </div>
    </main>

    <script src="js/csrf.js"></script>
    <script>
        const form       = document.getElementById('forgotForm');
        const alertBox   = document.getElementById('alertBox');
        const submitBtn  = document.getElementById('submitBtn');
        const emailInput = document.getElementById('email');
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        function showAlert(html, type = 'error') {
            alertBox.innerHTML = html;
            alertBox.className = 'alert ' + type;
            alertBox.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        emailInput.addEventListener('input', () => {
            const errEl = document.querySelector('.error[data-for="email"]');
            if (errEl) errEl.textContent = '';
            emailInput.classList.remove('invalid');
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.style.display = 'none';

            const email = emailInput.value.trim();

            if (!emailRegex.test(email)) {
                const errEl = document.querySelector('.error[data-for="email"]');
                if (errEl) errEl.textContent = 'Please enter a valid email address.';
                emailInput.classList.add('invalid');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';

            try {
                // Ensure CSRF token is loaded before submitting
                if (window.__ensureCsrfToken) await window.__ensureCsrfToken();
                const csrf = window.__getCsrfToken ? window.__getCsrfToken() : '';

                const res = await fetch('php/send-reset.php', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrf
                    },
                    body: JSON.stringify({ email })
                });

                const raw = await res.text();
                let data;
                try {
                    data = JSON.parse(raw);
                } catch (parseErr) {
                    console.error('Non-JSON response:', raw);
                    showAlert('Server error. Check console for details.', 'error');
                    return;
                }

                if (data.success) {
                    let html = '✅ ' + (data.message || 'If that email is registered, a reset link has been sent.');

                    if (data.demo_link) {
                        html += `<br><br>
                            <a href="${data.demo_link}"
                               style="color:#2563eb;font-weight:600;text-decoration:underline;word-break:break-all;">
                                🔗 Click here to reset your password →
                            </a>`;
                        if (data.smtp_error) {
                            html += `<br><br>
                                <small style="color:#94a3b8;font-size:0.72rem;">
                                    (SMTP error: ${data.smtp_error.slice(0, 100)})
                                </small>`;
                        }
                    }

                    showAlert(html, 'success');
                    form.reset();
                } else {
                    showAlert(data.message || 'Something went wrong.', 'error');
                }
            } catch (err) {
                console.error(err);
                showAlert('Network error. Please check your connection.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Reset Link';
            }
        });
    </script>
</body>
</html>
