<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | IntelliHire</title>
    <link rel="stylesheet" href="css/login.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <span class="logo-mark">IHR</span>
                <span class="logo-text">IntelliHire</span>
            </a>
            <a href="login.html" class="btn btn-outline">Login</a>
        </div>
    </header>

    <main class="login-wrapper">
        <div class="login-card">
            <div class="login-head">
                <h1>Set a New Password</h1>
                <p>Choose a strong password for your account.</p>
            </div>

            <div id="alertBox" class="alert" style="display:none;"></div>

            <form id="resetForm">
                <div class="form-group">
                    <label>New Password *</label>
                    <input type="password" id="password" placeholder="Min. 8 characters" required />
                </div>
                <div class="form-group">
                    <label>Confirm Password *</label>
                    <input type="password" id="confirm" placeholder="Re-enter password" required />
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                    Reset Password
                </button>

                <p class="register-link">
                    Remembered it? <a href="login.html">Back to Login</a>
                </p>
            </form>
        </div>
    </main>

    <script src="js/csrf.js"></script>
    <script>
    const form = document.getElementById('resetForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    // Get token from URL
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    function showAlert(msg, type = 'error') {
        alertBox.textContent = msg;
        alertBox.className = 'alert ' + type;
        alertBox.style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    if (!token) {
        showAlert('Missing reset token. Please request a new link.');
        submitBtn.disabled = true;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';

        const p1 = document.getElementById('password').value;
        const p2 = document.getElementById('confirm').value;

        if (p1.length < 8) {
            showAlert('Password must be at least 8 characters.');
            return;
        }
        if (!/(?=.*[A-Za-z])(?=.*\d)/.test(p1)) {
            showAlert('Password must contain letters and numbers.');
            return;
        }
        if (p1 !== p2) {
            showAlert('Passwords do not match.');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Resetting...';

        try {
            const res = await fetch('php/reset-password.php', {
                method: 'POST',
                credentials: 'same-origin',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-Token': window.__getCsrfToken ? window.__getCsrfToken() : ''
                },
                body: JSON.stringify({ token, password: p1 })
            });
            const data = await res.json();

            if (data.success) {
                showAlert(data.message, 'success');
                setTimeout(() => window.location.href = 'login.html', 2000);
            } else {
                showAlert(data.message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            }
        } catch (err) {
            showAlert('Network error.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Reset Password';
        }
    });
    </script>
</body>
</html>
