<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | IntelliHire</title>
    <link rel="stylesheet" href="css/login.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <span class="logo-mark">IHR</span>
                <span class="logo-text">IntelliHire</span>
            </a>
            <a href="login.html" class="btn btn-outline">Login</a>
        </div>
    </header>

    <main class="login-wrapper">
        <div class="login-card">
            <div class="login-head">
                <h1>Forgot Password?</h1>
                <p>Enter your email and we'll send you a reset link.</p>
            </div>

            <div id="alertBox" class="alert" style="display:none;"></div>

            <form id="forgotForm" novalidate>
                <div class="form-group">
                    <label for="email">Email Address <span class="req">*</span></label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required />
                    <small class="error" data-for="email"></small>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                    Send Reset Link
                </button>

                <p class="register-link">
                    Remembered it? <a href="login.html">Back to Login</a>
                </p>
            </form>
        </div>
    </main>

    <script>
        /* =========================================================
           IntelliHire - Forgot Password
           Uses send-reset-v2.php to bypass PHP OPcache on Render.
           ========================================================= */

        const form       = document.getElementById('forgotForm');
        const alertBox   = document.getElementById('alertBox');
        const submitBtn  = document.getElementById('submitBtn');
        const emailInput = document.getElementById('email');
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        function showAlert(html, type) {
            alertBox.innerHTML = html;
            alertBox.className = 'alert ' + (type || 'error');
            alertBox.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.style.display = 'none';

            const email = emailInput.value.trim();

            if (!emailRegex.test(email)) {
                showAlert('Please enter a valid email address.', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';

            try {
                const res = await fetch('php/send-reset-v2.php', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    cache: 'no-store',
                    body: JSON.stringify({ email })
                });

                const raw = await res.text();
                console.log('=== RAW RESPONSE ===');
                console.log(raw);

                let data;
                try {
                    data = JSON.parse(raw);
                } catch (err) {
                    showAlert('Server error: ' + raw.slice(0, 200), 'error');
                    return;
                }

                let html = '';

                if (data.success) {
                    html = '✅ ' + (data.message || 'If that email is registered, a reset link has been sent.');

                    if (data.demo_link) {
                        html += '<br><br>' +
                                '<a href="' + data.demo_link + '" ' +
                                'style="color:#2563eb;font-weight:600;text-decoration:underline;word-break:break-all;font-size:1.05em;">' +
                                '🔗 Click here to reset your password →' +
                                '</a>';
                    } else {
                        /* In production, the reset link is delivered by email — not shown on screen.
                           This is the intended behaviour. */
                        html += '<br><br><small style="color:#64748b;">Please check your inbox (and spam folder) for the reset link.</small>';
                    }

                    if (data.smtp_error) {
                        html += '<br><br><small style="color:#94a3b8;font-size:0.72rem;">SMTP: ' +
                                String(data.smtp_error).slice(0, 150) +
                                '</small>';
                    }

                    showAlert(html, 'success');
                    form.reset();
                } else {
                    showAlert(data.message || 'Something went wrong.', 'error');
                }
            } catch (err) {
                console.error(err);
                showAlert('Network error: ' + err.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Reset Link';
            }
        });
    </script>
</body>
</html>
